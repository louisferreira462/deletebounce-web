<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DeleteBounce</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--blue:#00539C;--blue-d:#003f78;--yellow:#FFD662;--yellow-d:#f5c63a;--bg:#eef1f6;--panel:#fff;--ink:#0e2438;--mut:#6b7a90;--line:#e6ebf2;--soft:#f5f8fc;--dead:#7b8aa0;--unk:#b58a07}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  .app{display:flex;gap:18px;max-width:1080px;margin:0 auto;padding:24px;align-items:flex-start;min-height:100vh}
  .side{width:262px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(14,36,56,.05);position:sticky;top:24px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 6px 14px}
  .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--blue)}
  .brand b{font-size:15px;font-weight:800;color:var(--blue)}
  .nav{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mut);text-decoration:none;cursor:pointer}
  .nav a.on{background:rgba(0,83,156,.09);color:var(--blue)}
  .sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:8px 8px 6px}
  .key{width:100%;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;outline:none;transition:.2s}
  .key:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,83,156,.14)}
  .jobs{display:flex;flex-direction:column;gap:3px;margin-top:4px;max-height:240px;overflow:auto}
  .job{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;font-size:13px;color:var(--ink);cursor:pointer}
  .job:hover{background:var(--soft)}.job .ic{color:var(--mut)}.job small{margin-left:auto;color:var(--mut)}
  .empty{font-size:12px;color:var(--mut);padding:6px 10px}
  .main{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(14,36,56,.05);min-height:540px}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .head h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.3px}
  .head .pill{font-size:12px;font-weight:600;color:var(--blue);background:rgba(0,83,156,.08);padding:6px 12px;border-radius:99px}
  .zone{border:2px dashed #cdd9e8;border-radius:16px;background:var(--soft);padding:54px 24px;text-align:center;cursor:pointer;transition:.2s}
  .zone:hover,.zone.over{border-color:var(--blue);background:rgba(0,83,156,.05)}
  .zone .ic{color:var(--blue);margin-bottom:12px}
  .zone h3{margin:0 0 4px;font-size:16px;font-weight:700}
  .zone p{margin:0;color:var(--mut);font-size:13px}
  .ready{display:none;align-items:center;gap:12px;margin-top:16px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .ready .fic{width:34px;height:34px;border-radius:9px;background:rgba(255,214,98,.3);display:grid;place-items:center}
  .ready b{font-size:14px}.ready small{color:var(--mut);font-size:12px;display:block}
  .ready .x{margin-left:auto;color:var(--mut);cursor:pointer;font-size:18px;padding:4px}
  .btn{border:0;border-radius:12px;padding:12px 24px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:.18s}
  .go{margin-top:16px;color:var(--blue);background:var(--yellow);box-shadow:0 8px 20px rgba(255,214,98,.5)}
  .go:hover{background:var(--yellow-d);transform:translateY(-2px)}
  .go:disabled{opacity:.5;transform:none;cursor:not-allowed;box-shadow:none}
  .err{color:#c0392b;font-size:13px;margin-top:10px;min-height:16px}
  .prog{display:none;margin-top:22px;border-top:1px solid var(--line);padding-top:20px}
  .phase{font-size:14px;font-weight:700;margin-bottom:12px}
  .bar{height:12px;background:#e7eef7;border-radius:99px;overflow:hidden}
  .bar>div{height:100%;width:0;border-radius:99px;background:linear-gradient(120deg,var(--blue),var(--yellow));transition:width .4s;background-size:200% 100%;animation:flow 1.6s linear infinite}
  @keyframes flow{to{background-position:200% 0}}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
  .st{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
  .st b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px}.st small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .st.live b{color:var(--blue)}.st.dead b{color:var(--dead)}.st.unk b{color:var(--unk)}
  .dl{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .chip{flex:1;min-width:120px;text-align:center;background:#fff;border:1.5px solid var(--blue);color:var(--blue);border-radius:12px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;transition:.18s}
  .chip:hover{background:var(--blue);color:#fff}
  @media(max-width:720px){.app{flex-direction:column}.side{width:100%;position:static}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">📭</div><b>DeleteBounce</b></div>
    <div class="nav"><a class="on">⚡ Verify</a></div>
    <div class="sec">Access key</div>
    <input id="key" class="key" type="password" placeholder="••••••••••••" autocomplete="off" />
    <div class="sec">Recent jobs</div>
    <div class="jobs" id="jobs"><div class="empty">No jobs yet.</div></div>
  </aside>

  <main class="main">
    <div class="head"><h1 id="title">Verify a list</h1><span class="pill">live · dead · unknown</span></div>

    <div class="zone" id="zone">
      <div class="ic"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0L8 8m4-4l4 4"/><path d="M20 16.5A4.5 4.5 0 0016 8h-1.26A6 6 0 104 14.5"/></svg></div>
      <h3>Drop your email list here</h3>
      <p>.txt or .csv — or click to browse</p>
    </div>
    <input type="file" id="file" accept=".txt,.csv" hidden />

    <div class="ready" id="ready">
      <div class="fic">📄</div>
      <div><b id="fname">list.txt</b><small id="fmeta">0 emails</small></div>
      <div class="x" id="clear">✕</div>
    </div>
    <button id="go" class="btn go" disabled>Verify list →</button>
    <div class="err" id="err"></div>

    <div class="prog" id="prog">
      <div class="phase" id="phase">Submitting…</div>
      <div class="bar"><div id="fill"></div></div>
      <div class="stats">
        <div class="st live"><b id="s-live">0</b><small>live</small></div>
        <div class="st dead"><b id="s-dead">0</b><small>dead</small></div>
        <div class="st unk"><b id="s-unk">0</b><small>unknown</small></div>
        <div class="st"><b id="s-prog">0/0</b><small>done</small></div>
      </div>
      <div class="dl" id="dl" style="display:none">
        <button class="chip" data-b="live">⬇ live.csv</button>
        <button class="chip" data-b="dead">⬇ dead.csv</button>
        <button class="chip" data-b="unknown">⬇ unknown.csv</button>
      </div>
    </div>
  </main>
</div>

<script>
const API='https://kdyl3zxpydaunmmuislklxso2q0hnjwj.lambda-url.eu-south-1.on.aws';
const $=(id)=>document.getElementById(id);
let emails=[],fname='',jobId=null,timer=null;
$('key').value=localStorage.getItem('db_key')||'';$('key').oninput=()=>localStorage.setItem('db_key',$('key').value.trim());
const KEY=()=>$('key').value.trim();const H=(j)=>{const h={'x-api-key':KEY()};if(j)h['content-type']='application/json';return h;};

// ---- recent jobs (localStorage) ----
const getJobs=()=>{try{return JSON.parse(localStorage.getItem('db_jobs')||'[]')}catch(e){return[]}};
const saveJob=(j)=>{const a=getJobs().filter(x=>x.id!==j.id);a.unshift(j);localStorage.setItem('db_jobs',JSON.stringify(a.slice(0,8)));renderJobs();};
function renderJobs(){const a=getJobs();$('jobs').innerHTML=a.length?'':'<div class="empty">No jobs yet.</div>';
  a.forEach(j=>{const d=document.createElement('div');d.className='job';d.innerHTML='<span class="ic">📄</span>'+j.name+'<small>'+j.n+'</small>';d.onclick=()=>view(j);$('jobs').appendChild(d);});}
renderJobs();

// ---- file load ----
const parse=(t)=>[...new Set(t.split('\n').map(s=>s.trim().toLowerCase()).filter(Boolean))];
async function loadFile(f){if(!f)return;fname=f.name;emails=parse(await f.text());
  $('zone').style.display='none';$('ready').style.display='flex';$('fname').textContent=fname;$('fmeta').textContent=emails.length.toLocaleString()+' emails';$('go').disabled=emails.length===0;}
$('zone').onclick=()=>$('file').click();
$('file').onchange=(e)=>loadFile(e.target.files[0]);
['dragover','dragenter'].forEach(ev=>$('zone').addEventListener(ev,e=>{e.preventDefault();$('zone').classList.add('over');}));
['dragleave','drop'].forEach(ev=>$('zone').addEventListener(ev,e=>{e.preventDefault();$('zone').classList.remove('over');}));
$('zone').addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
$('clear').onclick=()=>{emails=[];fname='';$('ready').style.display='none';$('zone').style.display='block';$('go').disabled=true;$('file').value='';};

// ---- verify ----
$('go').onclick=async()=>{$('err').textContent='';
  if(!KEY()){$('err').textContent='Enter your access key (left panel).';return;}
  if(!emails.length){$('err').textContent='Load a file first.';return;}
  $('go').disabled=true;$('prog').style.display='block';$('dl').style.display='none';$('phase').textContent='Submitting…';
  try{const r=await fetch(API+'/enqueue',{method:'POST',headers:H(true),body:JSON.stringify({emails})});
    if(r.status===401)throw new Error('Invalid access key.');const d=await r.json();if(!r.ok)throw new Error(d.error||'failed');
    saveJob({id:d.jobId,name:fname||'list',n:d.count});start(d.jobId);
  }catch(e){$('err').textContent=e.message;$('go').disabled=false;}};

function start(id){jobId=id;clearInterval(timer);$('prog').style.display='block';$('phase').textContent='Verifying…';poll();timer=setInterval(poll,2500);}
function view(j){$('title').textContent=j.name;start(j.id);$('main').scrollIntoView?0:0;}
async function poll(){if(!jobId)return;try{const r=await fetch(API+'/status?jobId='+encodeURIComponent(jobId),{headers:H(false)});
  const d=await r.json();if(!r.ok)return;
  $('s-live').textContent=(d.live??0).toLocaleString();$('s-dead').textContent=(d.dead??0).toLocaleString();$('s-unk').textContent=(d.unknown??0).toLocaleString();
  $('s-prog').textContent=(d.processed??0)+'/'+(d.total??0);$('fill').style.width=(d.total?(d.processed/d.total*100):0)+'%';
  if(d.total>0&&d.processed>=d.total){clearInterval(timer);$('phase').textContent='✅ Done — '+d.total.toLocaleString()+' verified';$('dl').style.display='flex';$('go').disabled=false;}
}catch(e){}}
document.querySelectorAll('.chip').forEach(b=>{b.onclick=async()=>{
  const r=await fetch(API+'/download?jobId='+encodeURIComponent(jobId)+'&bucket='+b.dataset.b,{headers:H(false)});
  const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=b.dataset.b+'.csv';a.click();URL.revokeObjectURL(a.href);};});
</script>
</body>
</html>
