<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DeleteBounce — Clean your email list</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --blue:#00539C; --blue-d:#003f78; --yellow:#FFD662; --yellow-d:#f5c63a;
    --bg:#eef3f9; --card:#ffffff; --ink:#0e2438; --mut:#5d6e85; --line:#e1e9f3;
    --live:#00539C; --dead:#7b8aa0; --unk:#b58a07;
  }
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;
    background-image:radial-gradient(700px 350px at 12% -5%,rgba(0,83,156,.12),transparent 60%),
                     radial-gradient(520px 300px at 95% 0%,rgba(255,214,98,.30),transparent 62%)}
  .wrap{max-width:760px;margin:0 auto;padding:40px 20px 60px}
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:36px}
  .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:var(--blue);box-shadow:0 8px 22px rgba(0,83,156,.35)}
  .brand b{font-size:18px;font-weight:800;letter-spacing:-.2px;color:var(--blue)}
  .brand span{color:var(--mut);font-size:13px;margin-left:auto;font-weight:500}
  h1{font-size:44px;line-height:1.06;font-weight:800;letter-spacing:-1.6px;margin:0 0 12px;color:var(--ink)}
  h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--yellow) 62%);padding:0 4px;border-radius:3px}
  .lead{color:var(--mut);font-size:16px;margin:0 0 30px;max-width:520px;line-height:1.6}
  .lead b{color:var(--blue)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;
    box-shadow:0 14px 40px rgba(14,36,56,.07);margin-bottom:18px}
  label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:7px}
  .key{width:100%;background:#f7fafd;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;outline:none;transition:.2s}
  .key:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,83,156,.15)}
  .drop{margin-top:16px;border:1.5px dashed #c8d6e8;border-radius:14px;transition:.2s;overflow:hidden;background:#f7fafd}
  .drop.over{border-color:var(--blue);background:rgba(0,83,156,.05)}
  textarea{width:100%;height:190px;resize:vertical;background:transparent;color:var(--ink);border:0;outline:none;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6}
  textarea::placeholder{color:#9fb0c6}
  .row{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}
  .btn{border:0;border-radius:12px;padding:13px 26px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;transition:.18s}
  .btn-primary{color:var(--blue);background:var(--yellow);box-shadow:0 8px 22px rgba(255,214,98,.55)}
  .btn-primary:hover{background:var(--yellow-d);transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,214,98,.6)}
  .btn-primary:disabled{opacity:.55;transform:none;cursor:not-allowed}
  .file label{display:inline;text-transform:none;letter-spacing:0;color:var(--blue);cursor:pointer;font-weight:700;font-size:13px}
  .count{margin-left:auto;font-size:13px;color:var(--mut);font-weight:600}
  .err{color:#c0392b;font-size:13px;margin-top:10px;min-height:16px}
  .phase{font-size:14px;color:var(--ink);font-weight:700;margin-bottom:12px}
  .bar{height:12px;background:#e7eef7;border-radius:99px;overflow:hidden}
  .bar>div{height:100%;width:0;border-radius:99px;background:linear-gradient(120deg,var(--blue),var(--yellow));transition:width .4s ease;background-size:200% 100%;animation:flow 1.6s linear infinite}
  @keyframes flow{to{background-position:200% 0}}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
  .pill{background:#f7fafd;border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
  .pill b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px;color:var(--ink)}
  .pill small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .live b{color:var(--live)}.dead b{color:var(--dead)}.unk b{color:var(--unk)}
  .dl{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .chip{flex:1;min-width:130px;text-align:center;background:#fff;border:1.5px solid var(--blue);color:var(--blue);border-radius:12px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;transition:.18s}
  .chip:hover{background:var(--blue);color:#fff;transform:translateY(-1px)}
  .foot{text-align:center;color:var(--mut);font-size:12px;margin-top:30px}
  @media(max-width:560px){h1{font-size:33px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">📭</div><b>DeleteBounce</b><span>bulk email verification</span></div>
  <h1>Clean your list,<br><em>keep only the live ones.</em></h1>
  <p class="lead">Paste or drop a list — we sort every address into <b>live</b>, <b>dead</b>, and <b>unknown</b>, then hand you clean CSVs.</p>
  <div class="card">
    <label for="key">Access key</label>
    <input id="key" class="key" type="password" placeholder="••••••••••••" autocomplete="off" />
    <div class="drop" id="drop">
      <textarea id="emails" placeholder="one email per line…&#10;john@gmail.com&#10;jane@outlook.com&#10;&#10;…or drop a .txt / .csv file here"></textarea>
    </div>
    <div class="row">
      <button id="go" class="btn btn-primary">Verify list →</button>
      <span class="file"><label for="file">📎 upload file</label><input type="file" id="file" accept=".txt,.csv" hidden /></span>
      <span class="count" id="count"></span>
    </div>
    <div class="err" id="err"></div>
  </div>
  <div class="card" id="progress" style="display:none">
    <div class="phase" id="phase">Submitting…</div>
    <div class="bar"><div id="fill"></div></div>
    <div class="stats">
      <div class="pill live"><b id="s-live">0</b><small>live</small></div>
      <div class="pill dead"><b id="s-dead">0</b><small>dead</small></div>
      <div class="pill unk"><b id="s-unk">0</b><small>unknown</small></div>
      <div class="pill"><b id="s-prog">0/0</b><small>done</small></div>
    </div>
    <div class="dl" id="dl" style="display:none">
      <button class="chip" data-b="live">⬇ live.csv</button>
      <button class="chip" data-b="dead">⬇ dead.csv</button>
      <button class="chip" data-b="unknown">⬇ unknown.csv</button>
    </div>
  </div>
  <div class="foot">Powered by your own distributed workers · eu-south-1</div>
</div>
<script>
const API='https://kdyl3zxpydaunmmuislklxso2q0hnjwj.lambda-url.eu-south-1.on.aws';
let jobId=null,timer=null;const $=(id)=>document.getElementById(id);
$('key').value=localStorage.getItem('db_key')||'';$('key').oninput=()=>localStorage.setItem('db_key',$('key').value.trim());
const KEY=()=>$('key').value.trim();const H=(j)=>{const h={'x-api-key':KEY()};if(j)h['content-type']='application/json';return h;};
const countLines=()=>{const n=$('emails').value.split('\n').map(s=>s.trim()).filter(Boolean).length;$('count').textContent=n?n.toLocaleString()+' emails':'';};
$('emails').oninput=countLines;
const loadFile=async(f)=>{if(f){$('emails').value=await f.text();countLines();}};
$('file').onchange=(e)=>loadFile(e.target.files[0]);
const drop=$('drop');
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
$('go').onclick=async()=>{const text=$('emails').value.trim();$('err').textContent='';
  if(!KEY()){$('err').textContent='Enter your access key.';return;}if(!text){$('err').textContent='Paste or drop some emails first.';return;}
  $('go').disabled=true;$('progress').style.display='block';$('dl').style.display='none';$('phase').textContent='Submitting…';
  try{const r=await fetch(API+'/enqueue',{method:'POST',headers:H(true),body:JSON.stringify({text})});
    if(r.status===401)throw new Error('Invalid access key.');const d=await r.json();if(!r.ok)throw new Error(d.error||'enqueue failed');
    jobId=d.jobId;$('phase').textContent='Verifying '+d.count.toLocaleString()+' emails…';poll();timer=setInterval(poll,2500);
  }catch(e){$('err').textContent=e.message;$('go').disabled=false;}};
async function poll(){if(!jobId)return;try{const r=await fetch(API+'/status?jobId='+encodeURIComponent(jobId),{headers:H(false)});
  const d=await r.json();if(!r.ok)return;
  $('s-live').textContent=(d.live??0).toLocaleString();$('s-dead').textContent=(d.dead??0).toLocaleString();$('s-unk').textContent=(d.unknown??0).toLocaleString();
  $('s-prog').textContent=(d.processed??0)+'/'+(d.total??0);$('fill').style.width=(d.total?(d.processed/d.total*100):0)+'%';
  if(d.total>0&&d.processed>=d.total){clearInterval(timer);$('phase').textContent='✅ Done — '+d.total.toLocaleString()+' verified';$('dl').style.display='flex';$('go').disabled=false;}}catch(e){}}
document.querySelectorAll('.chip').forEach(b=>{b.onclick=async()=>{
  const r=await fetch(API+'/download?jobId='+encodeURIComponent(jobId)+'&bucket='+b.dataset.b,{headers:H(false)});
  const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=b.dataset.b+'.csv';a.click();URL.revokeObjectURL(a.href);};});
</script>
</body>
</html>
