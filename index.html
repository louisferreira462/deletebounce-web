<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DeleteBounce</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--blue:#00539C;--blue2:#1d76d1;--yellow:#FFD662;--yellow-d:#f5c63a;--bg:#eef2f8;--card:#fff;--ink:#10243b;--mut:#748499;--line:#e9eef5;--soft:#f6f9fd;--dead:#8493a8;--unk:#b58a07}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--ink);background:var(--bg);background-image:radial-gradient(900px 500px at 50% -15%,rgba(0,83,156,.10),transparent 60%),radial-gradient(700px 400px at 100% 0,rgba(255,214,98,.16),transparent 60%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
  .stage{width:100%;max-width:600px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 70px rgba(16,36,59,.12);padding:30px;margin-bottom:18px}
  .head{display:flex;align-items:center;gap:14px;margin-bottom:24px}
  .hicon{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 10px 24px rgba(0,83,156,.35)}
  .head h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.3px}
  .head p{margin:2px 0 0;color:var(--mut);font-size:13px}
  .keyf{margin-left:auto;width:130px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;outline:none;color:var(--ink);transition:.2s}
  .keyf:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,83,156,.14);width:150px}
  .zone{border:2px dashed #cdd9e8;border-radius:18px;background:var(--soft);padding:42px 24px;text-align:center;cursor:pointer;transition:.2s}
  .zone:hover,.zone.over{border-color:var(--blue);background:rgba(0,83,156,.04)}
  .glow{width:78px;height:78px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;color:var(--blue);background:radial-gradient(circle at 50% 42%,rgba(0,83,156,.20),rgba(0,83,156,.03) 70%)}
  .glow svg{filter:drop-shadow(0 6px 14px rgba(0,83,156,.45))}
  .zone h3{margin:0 0 5px;font-size:17px;font-weight:700}.zone .sub{margin:0 0 18px;color:var(--mut);font-size:13px}
  .browse{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 22px;font-size:14px;font-weight:700;color:var(--ink);box-shadow:0 4px 12px rgba(16,36,59,.06)}
  .row{display:flex;align-items:center;gap:13px;margin-top:18px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
  .row .fic{width:38px;height:38px;flex:none;border-radius:10px;background:rgba(255,214,98,.35);display:grid;place-items:center;font-size:16px}
  .row .nm{min-width:0;flex:1}.row .nm b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .nm small{color:var(--mut);font-size:12px}
  .row .x{flex:none;color:var(--mut);cursor:pointer;font-size:16px;padding:4px;border:0;background:none}
  .go{margin-top:20px;width:100%;border:0;border-radius:14px;padding:15px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;color:var(--blue);background:var(--yellow);box-shadow:0 10px 26px rgba(255,214,98,.55);transition:.18s}
  .go:hover:not(:disabled){background:var(--yellow-d);transform:translateY(-2px)}
  .go:disabled{opacity:.55;transform:none;cursor:not-allowed;box-shadow:none}
  .err{color:#c0392b;font-size:13px;margin-top:12px;text-align:center;min-height:16px}
  .res{display:none;padding:0;overflow:hidden}
  .winbar{display:flex;align-items:center;gap:7px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .dot{width:11px;height:11px;border-radius:50%}.d1{background:#ff5f57}.d2{background:#febc2e}.d3{background:#28c840}
  .winbar .fn{margin-left:8px;font-size:12px;color:var(--mut)}
  .phase{padding:14px 16px 4px;font-size:13px;font-weight:700}
  .bar{height:10px;margin:0 16px;background:#e7eef7;border-radius:99px;overflow:hidden}
  .bar>div{height:100%;width:0;border-radius:99px;background:linear-gradient(120deg,var(--blue),var(--yellow));transition:width .4s;background-size:200% 100%;animation:flow 1.5s linear infinite}
  @keyframes flow{to{background-position:200% 0}}
  .chips{display:flex;gap:8px;padding:14px 16px;flex-wrap:wrap}
  .c{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--soft);border:1px solid var(--line)}
  .c.live{color:var(--blue)}.c.dead{color:var(--dead)}.c.unk{color:var(--unk)}
  .tbl{max-height:300px;overflow:auto;display:none}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;padding:9px 16px;background:var(--soft);position:sticky;top:0}
  td{padding:11px 16px;border-top:1px solid var(--line);font-size:12.5px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
  .b-live{color:var(--blue);background:rgba(0,83,156,.1)}.b-dead{color:var(--dead);background:rgba(132,147,168,.14)}.b-unk{color:var(--unk);background:rgba(255,214,98,.25)}
  .resfoot{display:none;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
  .resfoot small{color:var(--mut);font-size:12px;margin-right:auto}
  .chip{background:#fff;border:1.5px solid var(--blue);color:var(--blue);border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.18s}
  .chip:hover{background:var(--blue);color:#fff}
  .stopb{margin-left:auto;border:1px solid #e6b9b9;color:#c0392b;background:#fff;border-radius:8px;padding:5px 11px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
  .stopb:hover:not(:disabled){background:#c0392b;color:#fff}
  .stopb:disabled{opacity:.5;cursor:default}
  .recent{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:18px}
  .rhead{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:6px}
  .rj{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;font-size:13px;cursor:pointer}
  .rj:hover{background:var(--soft)}.rj small{margin-left:auto;color:var(--mut)}
  .foot{text-align:center;color:var(--mut);font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div class="stage">
  <div class="card">
    <div class="head">
      <div class="hicon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L7 8m5-5l5 5"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg></div>
      <div><h1>Clean your list</h1><p>Sorted into LIVE · DEAD · UNKNOWN</p></div>
      <input id="key" class="keyf" type="password" placeholder="YOUR KEY" autocomplete="off" />
    </div>
    <div class="zone" id="zone">
      <div class="glow"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5m0 0L8 9m4-4l4 4"/><path d="M20 16.5A4.5 4.5 0 0016 8h-1.26A6 6 0 104 14.5"/></svg></div>
      <h3>Choose a file or drag &amp; drop it here</h3>
      <p class="sub">.txt or .csv — one email per line</p>
      <span class="browse">Browse file</span>
    </div>
    <input type="file" id="file" accept=".txt,.csv" hidden />
    <div class="row" id="row" style="display:none">
      <div class="fic">📄</div>
      <div class="nm"><b id="fname">list.txt</b><small id="fmeta">0 emails</small></div>
      <button class="x" id="clear">✕</button>
    </div>
    <button id="go" class="go" disabled>Verify list</button>
    <div class="err" id="err"></div>
  </div>

  <div class="card res" id="res">
    <div class="winbar"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="fn" id="resname">results.csv</span><button class="stopb" id="stop">⏹ Stop</button></div>
    <div class="phase" id="phase">Verifying…</div>
    <div class="bar"><div id="fill"></div></div>
    <div class="chips">
      <span class="c live"><span id="c-live">0</span> LIVE</span>
      <span class="c dead"><span id="c-dead">0</span> DEAD</span>
      <span class="c unk"><span id="c-unk">0</span> UNKNOWN</span>
      <span class="c"><span id="c-prog">0/0</span> DONE</span>
    </div>
    <div class="tbl" id="tbl"><table><thead><tr><th>Email</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div>
    <div class="resfoot" id="resfoot">
      <small id="resmeta"></small>
      <button class="chip" data-b="live">⬇ live</button>
      <button class="chip" data-b="dead">⬇ dead</button>
      <button class="chip" data-b="unknown">⬇ unknown</button>
    </div>
  </div>

  <div class="recent" id="recent"><div class="rhead">Recent jobs</div><div id="recentList"></div></div>
  <div class="foot">📭 DeleteBounce — distributed email verification</div>
</div>

<script>
const API='https://kdyl3zxpydaunmmuislklxso2q0hnjwj.lambda-url.eu-south-1.on.aws';
const $=(id)=>document.getElementById(id);
let emails=[],fname='',jobId=null,timer=null,busy=false,stopping=false;
$('key').value=localStorage.getItem('db_key')||'';$('key').oninput=()=>localStorage.setItem('db_key',$('key').value.trim());
const KEY=()=>$('key').value.trim();const H=(j)=>{const h={'x-api-key':KEY()};if(j)h['content-type']='application/json';return h;};
const parse=(t)=>[...new Set(t.split('\n').map(s=>s.trim().toLowerCase()).filter(Boolean))];
const FLEET=5; // jumlah worker ke-deploy (jadiin 10 pas udah nambah mail6-10)
const workersFor=(n)=>{let w;if(n<=500)w=1;else if(n<=1000)w=2;else if(n<=2000)w=3;else if(n<=3000)w=4;else if(n<=5000)w=5;else w=5+Math.ceil((n-5000)/5000);return Math.min(w,FLEET);};

// recent jobs (localStorage)
const getJobs=()=>{try{return JSON.parse(localStorage.getItem('db_jobs')||'[]')}catch(e){return[]}};
const saveJob=(j)=>{const a=getJobs().filter(x=>x.id!==j.id);a.unshift(j);localStorage.setItem('db_jobs',JSON.stringify(a.slice(0,10)));renderJobs();};
function renderJobs(){const a=getJobs();const el=$('recentList');$('recent').style.display=a.length?'block':'none';
  el.innerHTML=a.map(j=>'<div class="rj" data-id="'+j.id+'"><span>📄 '+j.name+'</span><small>'+j.n+' emails</small></div>').join('');
  el.querySelectorAll('.rj').forEach(r=>{r.onclick=()=>{const j=getJobs().find(x=>x.id===r.dataset.id);if(j)view(j);};});}
renderJobs();

async function loadFile(f){if(!f)return;fname=f.name;emails=parse(await f.text());
  $('zone').style.display='none';$('row').style.display='flex';$('fname').textContent=fname;$('fmeta').textContent=emails.length.toLocaleString()+' emails';$('go').disabled=!emails.length;}
$('zone').onclick=()=>$('file').click();$('file').onchange=(e)=>loadFile(e.target.files[0]);
['dragover','dragenter'].forEach(ev=>$('zone').addEventListener(ev,e=>{e.preventDefault();$('zone').classList.add('over');}));
['dragleave','drop'].forEach(ev=>$('zone').addEventListener(ev,e=>{e.preventDefault();$('zone').classList.remove('over');}));
$('zone').addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
$('clear').onclick=()=>{if(busy)return;emails=[];fname='';$('row').style.display='none';$('zone').style.display='block';$('go').disabled=true;$('file').value='';};

$('go').onclick=async()=>{
  if(busy)return;                                  // anti double-submit
  $('err').textContent='';
  if(!KEY()){$('err').textContent='Enter your access key (top-right).';return;}
  if(!emails.length){$('err').textContent='Load a file first.';return;}
  busy=true;$('go').disabled=true;$('go').textContent='Verifying…';
  try{
    const CH=5000,total=emails.length;
    const post=async(payload)=>{const r=await fetch(API+'/enqueue',{method:'POST',headers:H(true),body:JSON.stringify(payload)});
      if(r.status===401)throw new Error('Invalid access key.');
      const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw new Error('Server error (HTTP '+r.status+'). Coba lagi.')}
      if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d;};
    const first=await post({emails:emails.slice(0,CH),total});           // chunk 1 creates the job (carries full total)
    const id=first.jobId;
    saveJob({id,name:fname||'list',n:total});track(id,fname||'list');
    (async()=>{for(let i=CH;i<total;i+=CH){                              // rest streams in, appended to same job
      for(let a=0;a<4;a++){try{await post({jobId:id,emails:emails.slice(i,i+CH)});break;}
        catch(_){if(a===3)$('err').textContent='Sebagian list gagal ke-upload — Verify ulang kalau progress mentok.';else await new Promise(res=>setTimeout(res,800));}}
    }})();
  }catch(e){$('err').textContent=e.message;busy=false;$('go').disabled=false;$('go').textContent='Verify list';}};

function track(id,name){clearInterval(timer);jobId=id;stopping=false;
  $('res').style.display='block';$('resname').textContent=(name||'results').replace(/\.[^.]+$/,'')+'_verified.csv';
  $('phase').style.display='block';document.querySelector('.bar').style.display='block';
  $('stop').style.display='block';$('stop').disabled=false;$('stop').textContent='⏹ Stop';
  $('tbl').style.display='none';$('resfoot').style.display='none';$('phase').textContent='🔌 Menyiapkan…';
  poll();timer=setInterval(poll,2500);}
function view(j){busy=false;$('go').disabled=!emails.length;$('go').textContent='Verify list';track(j.id,j.name);}
$('stop').onclick=async()=>{if(!jobId||stopping)return;
  if(!confirm('Stop verifikasi? Sisa email yang belum diproses akan DIBUANG (gak bisa dilanjut). Yang udah selesai tetap bisa di-download.'))return;
  stopping=true;$('stop').disabled=true;$('stop').textContent='Stopping…';$('phase').textContent='Stopping…';
  try{await fetch(API+'/cancel?jobId='+encodeURIComponent(jobId),{method:'POST',headers:H(false)});}catch(e){}};

async function poll(){if(!jobId)return;try{const r=await fetch(API+'/status?jobId='+encodeURIComponent(jobId),{headers:H(false)});
  const d=await r.json();if(!r.ok)return;
  $('c-live').textContent=(d.live??0).toLocaleString();$('c-dead').textContent=(d.dead??0).toLocaleString();$('c-unk').textContent=(d.unknown??0).toLocaleString();
  $('c-prog').textContent=(d.processed??0)+'/'+(d.total??0);
  document.querySelector('.bar>div').style.width=(d.total?(d.processed/d.total*100):0)+'%';
  const done=d.total>0&&d.processed>=d.total;
  if(d.cancelled||done){clearInterval(timer);busy=false;stopping=false;$('go').disabled=!emails.length;$('go').textContent='Verify another';
    $('stop').style.display='none';document.querySelector('.bar').style.display='none';
    $('phase').textContent=d.cancelled?('⏹ Stopped — '+(d.processed??0)+' done, rest discarded'):('✅ Done — '+d.total.toLocaleString()+' verified');
    showResults();}
  else{
    $('phase').textContent=(d.processed??0)===0?('🔌 Nyalain '+workersFor(d.total||0)+' mesin buat '+(d.total||0).toLocaleString()+' email… (~1 mnt)'):'Verifying…';
    if(!stopping){$('stop').style.display='block';$('stop').disabled=false;$('stop').textContent='⏹ Stop';}
  }
}catch(e){}}

async function fetchCsv(b){const r=await fetch(API+'/download?jobId='+encodeURIComponent(jobId)+'&bucket='+b,{headers:H(false)});return (await r.text()).split('\n').slice(1).map(s=>s.trim()).filter(Boolean);}
async function showResults(){
  const [live,dead,unk]=await Promise.all([fetchCsv('live'),fetchCsv('dead'),fetchCsv('unknown')]);
  const rows=[...live.map(e=>[e,'live']),...dead.map(e=>[e,'dead']),...unk.map(e=>[e,'unknown'])];
  const show=rows.slice(0,200);
  $('tbody').innerHTML=show.map(([e,s])=>'<tr><td>'+e+'</td><td><span class="badge b-'+s+'">'+s+'</span></td></tr>').join('');
  $('resmeta').textContent='Showing '+show.length+' of '+rows.length.toLocaleString();
  $('tbl').style.display='block';$('resfoot').style.display='flex';
}
document.querySelectorAll('.chip').forEach(b=>{b.onclick=async()=>{
  const r=await fetch(API+'/download?jobId='+encodeURIComponent(jobId)+'&bucket='+b.dataset.b,{headers:H(false)});
  const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=b.dataset.b+'.csv';a.click();URL.revokeObjectURL(a.href);};});
</script>
</body>
</html>
